packages:
  - apps/*
  - services/*
  - workers/*
  - packages/*

sharedWorkspaceLockfile: true
linkWorkspacePackages: false
saveWorkspaceProtocol: rolling
strictPeerDependencies: true
# hls.js 1.7.1 bundles these at runtime but its exported declarations still import them.
packageExtensions:
  hls.js@1.7.1:
    dependencies:
      "@svta/cml-cmcd": "2.4.0"
      eventemitter3: "5.0.4"
disallowWorkspaceCycles: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Reviewed version-specific exception: Turbo 2.10.12 carries npm signatures and SLSA provenance.
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.12"
  - "@turbo/darwin-arm64@2.10.12"
  - "@turbo/linux-64@2.10.12"
  - "@turbo/linux-arm64@2.10.12"
  - "@turbo/windows-64@2.10.12"
  - "@turbo/windows-arm64@2.10.12"
  - turbo@2.10.12
allowBuilds:
  # The postinstall only creates an unused CLI folder and prints dependency-range warnings.
  "@apollo/protobufjs": false
