name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.change.outputs.full }}
      platform: ${{ steps.change.outputs.platform }}
      diagnostics: ${{ steps.change.outputs.diagnostics }}
      classification: ${{ steps.change.outputs.classification }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Classify changed paths
        id: change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: node ./tools/classify-ci-change.ts --base "$BASE_SHA" --head "$HEAD_SHA"

  governance:
    name: Documentation and security
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Validate capability index
        run: node ./tools/verify-capability-index.ts
      - name: Test capability index
        run: node --test ./tools/verify-capability-index.test.ts
      - name: Validate repository memory
        run: node ./tools/verify-ai-state.ts
      - name: Validate documentation
        run: |
          node ./tools/verify-documentation.ts
      - name: Validate public contribution contract
        run: node ./tools/verify-community-files.ts
      - name: Scan tracked files for secrets
        run: node ./tools/scan-secrets.ts --all
      - name: Validate CI policy
        run: node ./tools/verify-ci-policy.ts
      - name: Validate local platform policy
        run: node ./tools/verify-local-platform.mjs
      - name: Test governance tools
        run: >-
          node --test
          ./tools/verify-ai-state.test.ts
          ./tools/verify-documentation.test.ts
          ./tools/verify-community-files.test.ts
          ./tools/scan-secrets.test.ts
          ./tools/classify-ci-change.test.ts
          ./tools/resolve-schema-baseline.test.ts
          ./tools/verify-ci-policy.test.ts
          ./tools/reset-local-platform.test.mjs
          ./tools/verify-discovery-runtime.test.mjs
          ./tools/verify-local-platform.test.mjs

  quality:
    name: Install and source quality
    needs: classify
    if: >-
      needs.classify.outputs.full == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Provision integrity-pinned pnpm
        run: |
          corepack enable
          corepack install
          pnpm --version
      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm content-addressed store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Run source quality and tests
        env:
          ASTER_SCHEMA_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          ASTER_SCHEMA_BASE="$(node ./tools/resolve-schema-baseline.ts)"
          export ASTER_SCHEMA_BASE
          pnpm check:source
      - name: Verify Docker context boundary
        if: needs.classify.outputs.platform == 'true'
        timeout-minutes: 1
        run: node ./tools/verify-docker-context.mjs
      - name: Prove real platform integration
        if: needs.classify.outputs.platform == 'true'
        timeout-minutes: 15
        run: pnpm integration
      - name: Prove Catalog runtime and generated publication
        if: needs.classify.outputs.platform == 'true'
        timeout-minutes: 10
        run: |
          pnpm catalog:media
          pnpm catalog:demo
      - name: Prove Playback persistence and federated runtime
        if: needs.classify.outputs.platform == 'true'
        timeout-minutes: 10
        run: |
          pnpm playback:integration
          pnpm playback:runtime
      - name: Prove Engagement persistence and federated progress
        if: needs.classify.outputs.platform == 'true'
        timeout-minutes: 20
        run: |
          pnpm engagement:integration
          pnpm engagement:rate-limit-integration
          pnpm engagement:runtime
      - name: Prove Discovery projection and federated search
        if: needs.classify.outputs.platform == 'true'
        timeout-minutes: 15
        run: |
          pnpm discovery:integration
          pnpm discovery:runtime
      - name: Prove Docker-only playable demo
        if: needs.classify.outputs.platform == 'true'
        timeout-minutes: 15
        env:
          ASTER_PLAYABLE_DEMO: "true"
          ASTER_ENGAGEMENT_DEMO: "true"
        run: |
          aster_playable_project="aster-playable-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$aster_playable_project" =~ ^aster-playable-ci-[0-9]+-[0-9]+$ ]]
          test -z "$(docker ps --all --quiet --filter "label=com.docker.compose.project=$aster_playable_project")"
          test -z "$(docker volume ls --quiet --filter "label=com.docker.compose.project=$aster_playable_project")"
          test -z "$(docker network ls --quiet --filter "label=com.docker.compose.project=$aster_playable_project")"
          playable_compose() {
            docker compose --project-name "$aster_playable_project" --file infra/compose/compose.yml --file infra/compose/playable.yml --profile runtime "$@"
          }
          personalized_compose() {
            docker compose --project-name "$aster_playable_project" --file infra/compose/compose.yml --file infra/compose/playable.yml --file infra/compose/events.yml --profile runtime "$@"
          }
          wait_playable_topics() {
            aster_topic_init="$(personalized_compose ps --all --quiet broker-init)"
            test -n "$aster_topic_init"
            test "$(timeout 120s docker wait "$aster_topic_init")" = 0
          }
          cleanup_playable() {
            aster_playable_status=$?
            personalized_compose logs --no-color --tail 15 playable-generate playable-seed broker-init || aster_playable_status=1
            personalized_compose down --volumes --timeout 10 || aster_playable_status=1
            test -z "$(docker ps --all --quiet --filter "label=com.docker.compose.project=$aster_playable_project")" || aster_playable_status=1
            test -z "$(docker volume ls --quiet --filter "label=com.docker.compose.project=$aster_playable_project")" || aster_playable_status=1
            test -z "$(docker network ls --quiet --filter "label=com.docker.compose.project=$aster_playable_project")" || aster_playable_status=1
            exit "$aster_playable_status"
          }
          trap cleanup_playable EXIT
          playable_compose up --build --wait --wait-timeout 180 web
          pnpm --filter @aster/web exec playwright install --with-deps chromium
          pnpm --filter @aster/web exec playwright test demo.spec.ts
          playable_compose up --no-build --wait --wait-timeout 90 web
          playable_compose logs --no-color --tail 1 playable-seed | grep '"changed":false'
          playable_compose logs --no-color --tail 1 playable-generate | grep 'generated_hls_reused'
          personalized_compose up --build --wait --wait-timeout 180 web identity engagement broker-init
          wait_playable_topics
          pnpm --filter @aster/web exec playwright test engagement.spec.ts
          personalized_compose up --no-build --wait --wait-timeout 90 web identity engagement broker-init
          wait_playable_topics
          personalized_compose logs --no-color --tail 1 playable-seed | grep '"changed":false'
          personalized_compose logs --no-color --tail 1 playable-generate | grep 'generated_hls_reused'
      - name: Audit known dependency vulnerabilities
        run: pnpm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: true
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, Elastic-2.0, ISC, MIT, MITNFA
          # ADR-0019/0020; Web tests enforce the exact pins omitted by the action.
          allow-dependencies-licenses: >-
            pkg:npm/%40axe-core/playwright, pkg:npm/axe-core,
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/caniuse-lite,
            pkg:npm/lightningcss,
            pkg:npm/lightningcss-android-arm64,
            pkg:npm/lightningcss-darwin-arm64,
            pkg:npm/lightningcss-darwin-x64,
            pkg:npm/lightningcss-freebsd-x64,
            pkg:npm/lightningcss-linux-arm-gnueabihf,
            pkg:npm/lightningcss-linux-arm64-gnu,
            pkg:npm/lightningcss-linux-arm64-musl,
            pkg:npm/lightningcss-linux-x64-gnu,
            pkg:npm/lightningcss-linux-x64-musl,
            pkg:npm/lightningcss-win32-arm64-msvc,
            pkg:npm/lightningcss-win32-x64-msvc
          vulnerability-check: true
          comment-summary-in-pr: never

  platform:
    name: Local platform
    timeout-minutes: 35
    needs: classify
    if: >-
      needs.classify.outputs.platform == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: infra/compose/compose.yml
      COMPOSE_PROJECT_NAME: aster-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Validate Compose model
        run: docker compose --file "$COMPOSE_FILE" config --quiet
      - name: Pull immutable platform images
        run: docker compose --file "$COMPOSE_FILE" pull
      - name: Validate executable SLI rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            --volume "$GITHUB_WORKSPACE/infra/observability:/etc/aster/observability:ro" \
            docker.io/prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            check rules /etc/aster/observability/slo-rules.yml /etc/aster/observability/slo-alerts.yml
          docker run --rm --entrypoint /bin/promtool \
            --volume "$GITHUB_WORKSPACE/infra/observability:/etc/aster/observability:ro" \
            docker.io/prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            test rules /etc/aster/observability/slo-rules.test.yml
          docker run --rm --entrypoint /bin/promtool \
            --volume "$GITHUB_WORKSPACE/infra/observability:/etc/aster/observability:ro" \
            docker.io/prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            test rules /etc/aster/observability/slo-alerts.test.yml
      - name: Start health-gated local platform
        run: >-
          docker compose --file "$COMPOSE_FILE" up
          --wait --wait-timeout 120 platform-status
      - name: Verify versions, protocols, initialization, and status
        run: |
          docker compose --file "$COMPOSE_FILE" ps --all
          docker compose --file "$COMPOSE_FILE" exec -T postgres psql --username=aster --dbname=aster --tuples-only --command="SHOW server_version" | grep '18.6'
          docker compose --file "$COMPOSE_FILE" exec -T redis redis-cli --raw INFO server | grep '^redis_version:8.10.0'
          docker compose --file "$COMPOSE_FILE" logs --no-color platform-init | grep 'aster local platform initialized'
      - name: Build and start the Docker-only full profile
        timeout-minutes: 10
        run: >-
          docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml
          --profile full up --build --wait --wait-timeout 120
      - name: Report bounded optional-profile startup failure
        if: failure()
        timeout-minutes: 1
        run: |
          docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --profile full ps --all
          docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --profile full logs --no-color --tail 120 grafana prometheus router
      - name: Verify packaged health and real telemetry
        timeout-minutes: 2
        run: |
          docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --profile full exec -T identity node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { request } from 'node:http';
          import { setTimeout } from 'node:timers/promises';
          assert.equal(process.getuid(), 1000);
          async function json(url) {
            const response = await fetch(url, { signal: AbortSignal.timeout(2000), redirect: 'error' });
            assert.equal(response.status, 200);
            return response.json();
          }
          assert.equal((await json('http://127.0.0.1:3100/health/ready')).readiness, 'ready');
          const playbackBody = JSON.stringify({
              query: 'mutation StartPlayback($titleId: ID!) { createPlaybackSession(titleId: $titleId) { code } }',
              operationName: 'StartPlayback',
              variables: { titleId: '00000000-0000-4000-8000-000000000001' },
          });
          const titleBody = JSON.stringify({
              query: 'query TitleDetail($id: ID!) { title(id: $id) { id } }',
              operationName: 'TitleDetail',
              variables: { id: '00000000-0000-4000-8000-000000000001' },
          });
          async function callGraphql(body) {
            return new Promise((resolve, reject) => {
              const outgoing = request('http://router:4000/graphql', {
                method: 'POST',
                signal: AbortSignal.timeout(2000),
                headers: {
                  host: '127.0.0.1:4000',
                  origin: 'http://127.0.0.1:4000',
                  'x-aster-csrf': '1',
                  'content-type': 'application/json',
                  'content-length': Buffer.byteLength(body),
                  connection: 'close',
                },
              }, incoming => {
                let text = '';
                incoming.setEncoding('utf8');
                incoming.on('data', chunk => {
                  if (text.length + chunk.length > 16384) {
                    incoming.destroy(new Error('GraphQL response exceeded 16 KiB.'));
                    return;
                  }
                  text += chunk;
                });
                incoming.on('error', reject);
                incoming.on('end', () => resolve({ status: incoming.statusCode, text }));
              });
              outgoing.on('error', reject);
              outgoing.end(body);
            });
          }
          const playbackResponse = await callGraphql(playbackBody);
          assert.equal(playbackResponse.status, 200);
          const playback = JSON.parse(playbackResponse.text);
          assert.equal(playback.errors, undefined);
          assert.equal(playback.data?.createPlaybackSession?.code, 'NOT_PLAYABLE');
          const titleResponse = await callGraphql(titleBody);
          assert.equal(titleResponse.status, 200);
          const title = JSON.parse(titleResponse.text);
          assert.equal(title.errors, undefined);
          assert.equal(title.data?.title, null);
          await setTimeout(6000);
          assert.equal((await callGraphql(playbackBody)).status, 200);
          assert.equal((await callGraphql(titleBody)).status, 200);
          const required = [
            'http_server_request_duration_seconds_count',
            'aster_dependency_operation_outcomes_total',
            'aster_nodejs_memory_usage_bytes',
            'aster_postgresql_pool_connections',
            'aster_product_operation_outcomes_total',
            'process_cpu_time_seconds_total',
            'process_memory_usage_bytes',
            'nodejs_eventloop_delay_p99_seconds',
            'aster_telemetry_export_attempts_total',
            'aster:sli:population:rate5m',
            'aster:sli:good:rate5m',
            'aster:sli:good:ratio_rate5m',
          ];
          const deadline = Date.now() + 45000;
          let present = [];
          while (Date.now() < deadline) {
            const body = await json('http://prometheus:9090/api/v1/label/__name__/values');
            assert.equal(body.status, 'success');
            present = required.filter(name => body.data.includes(name));
            if (present.length === required.length) break;
            await setTimeout(500);
          }
          assert.deepEqual(present, required);
          const sliValues = {};
          for (const sli of ['supergraph', 'catalog_title_read']) {
            const query = encodeURIComponent(`aster:sli:good:ratio_rate5m{sli="${sli}"}`);
            const ratioDeadline = Date.now() + 45000;
            let ratio;
            while (Date.now() < ratioDeadline) {
              ratio = await json('http://prometheus:9090/api/v1/query?query=' + query);
              assert.equal(ratio.status, 'success');
              if (ratio.data.result.length === 1) break;
              await setTimeout(500);
            }
            assert.equal(ratio?.data.result.length, 1);
            const value = Number(ratio.data.result[0].value[1]);
            assert.ok(Number.isFinite(value) && value >= 0 && value <= 1);
            sliValues[sli] = value;
          }
          console.log(JSON.stringify({ check: 'docker-only-demo', status: 'ok', uid: process.getuid(), metrics: present, sliValues }));
          NODE
      - name: Verify provisioned operational overview and optional failure isolation
        timeout-minutes: 2
        run: |
          grafana_health=$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/health)
          grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"' <<< "$grafana_health"
          grafana_datasource=$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/datasources/uid/aster-prometheus)
          grep -Fq '"uid":"aster-prometheus"' <<< "$grafana_datasource"
          grep -Fq '"url":"http://prometheus:9090"' <<< "$grafana_datasource"
          grafana_datasource_health=$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/datasources/uid/aster-prometheus/health)
          grep -Fq '"status":"OK"' <<< "$grafana_datasource_health"
          grafana_query=$(curl --fail --silent --show-error --max-time 3 'http://127.0.0.1:3001/api/datasources/proxy/uid/aster-prometheus/api/v1/query?query=aster%3Asli%3Agood%3Aratio_rate5m%7Bsli%3D%22playback_start%22%7D')
          grep -Fq '"status":"success"' <<< "$grafana_query"
          grafana_dashboard=$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/dashboards/uid/aster-operational-overview)
          grep -Fq '"uid":"aster-operational-overview"' <<< "$grafana_dashboard"
          grep -Fq '"editable":false' <<< "$grafana_dashboard"
          prometheus_rules=''
          for attempt in {1..20}; do
            if prometheus_rules=$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:9090/api/v1/rules); then
              if PROMETHEUS_RULES="$prometheus_rules" node --input-type=module <<'NODE'
          try {
          const payload = JSON.parse(process.env.PROMETHEUS_RULES);
          const rules = payload.data.groups.flatMap((group) => group.rules);
          process.exit(payload.status === 'success' && rules.length === 35 && rules.every(({ health }) => health === 'ok') ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
              then
                break
              fi
            fi
            sleep 3
          done
          prometheus_rules=$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:9090/api/v1/rules)
          PROMETHEUS_RULES="$prometheus_rules" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const payload = JSON.parse(process.env.PROMETHEUS_RULES);
          assert.equal(payload.status, 'success');
          const rules = payload.data.groups.flatMap((group) => group.rules);
          for (const rule of rules) {
            assert.equal(rule.health, 'ok');
          }
          assert.equal(rules.length, 35);
          const threeDayRatio = rules.find(({ name }) => name === 'aster:sli:error:ratio_rate3d');
          assert.ok(threeDayRatio);
          assert.match(threeDayRatio.query, /count_over_time\(aster:sli:population:rate5m\[3d:5m\]\) >= 864/);
          const alertRules = rules.filter(({ type }) => type === 'alerting');
          assert.equal(alertRules.length, 7);
          assert.equal(alertRules.filter(({ name }) => name === 'AsterCriticalJourneySloRapidBurn').length, 3);
          assert.equal(alertRules.filter(({ name }) => name === 'AsterCriticalJourneySloSustainedBurn').length, 4);
          for (const rule of alertRules) {
            assert.equal(rule.duration, 0);
            assert.equal(rule.keepFiringFor, 0);
            assert.equal(rule.annotations.runbook_url, 'https://github.com/andrewsrigom/aster-streaming-platform/blob/main/docs/operations/RUNBOOKS.md#runbook-critical-journey-slo-burn');
          }
          NODE
          prometheus_alerts=$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:9090/api/v1/alerts)
          PROMETHEUS_ALERTS="$prometheus_alerts" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const payload = JSON.parse(process.env.PROMETHEUS_ALERTS);
          assert.equal(payload.status, 'success');
          assert.equal(payload.data.alerts.length, 0);
          NODE
          docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --profile full stop --timeout 5 grafana
          platform_status_id=$(docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --profile full ps --quiet platform-status)
          test "$(docker inspect --format '{{.State.Health.Status}}' "$platform_status_id")" = healthy
      - name: Verify local Identity product API
        timeout-minutes: 1
        run: >-
          docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml
          --profile full exec -T identity node --input-type=module - --compose-router < tools/verify-local-identity.mjs
      - name: Verify GraphQL demand and trusted operations
        timeout-minutes: 2
        run: |
          node ./tools/verify-graphql-demand-controls.mjs
          docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --file infra/compose/graphql-security-proof.yml --profile full up --no-deps --force-recreate --wait --wait-timeout 60 router
          node ./tools/verify-trusted-operations.mjs
          docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --file infra/compose/graphql-security-proof.yml --profile full exec -T identity node --input-type=module - --metrics < tools/verify-trusted-operations.mjs
      - name: Remove the base project before diagnostic exercises
        if: needs.classify.outputs.diagnostics == 'true'
        timeout-minutes: 2
        run: docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --profile "*" down --volumes --remove-orphans --timeout 10
      - name: Diagnose three injected failures from telemetry
        if: needs.classify.outputs.diagnostics == 'true'
        timeout-minutes: 15
        run: node ./tools/run-diagnostic-exercises.mjs
      - name: Remove only the CI Compose project
        if: always()
        run: docker compose --file "$COMPOSE_FILE" --file infra/compose/observability.yml --profile "*" down --volumes --remove-orphans --timeout 10

  required:
    name: CI required
    if: always()
    needs: [classify, governance, quality, dependency-review, platform]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify applicable job results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          FULL_PATH: ${{ needs.classify.outputs.full }}
          PLATFORM_PATH: ${{ needs.classify.outputs.platform }}
          DIAGNOSTICS_PATH: ${{ needs.classify.outputs.diagnostics }}
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
        shell: bash
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" || "$GOVERNANCE_RESULT" != "success" ]]; then
            exit 1
          fi

          if [[ "$FULL_PATH" != "true" && "$FULL_PATH" != "false" ]]; then
            exit 1
          fi
          if [[ "$PLATFORM_PATH" != "true" && "$PLATFORM_PATH" != "false" ]]; then
            exit 1
          fi
          if [[ "$DIAGNOSTICS_PATH" != "true" && "$DIAGNOSTICS_PATH" != "false" ]]; then
            exit 1
          fi
          if [[ "$DIAGNOSTICS_PATH" == "true" && "$PLATFORM_PATH" != "true" ]]; then
            exit 1
          fi

          quality_expected=false
          if [[ "$FULL_PATH" == "true" && ( "$EVENT_NAME" != "pull_request" || "$IS_DRAFT" == "false" ) ]]; then
            quality_expected=true
          fi
          if [[ "$quality_expected" == "true" && "$QUALITY_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$quality_expected" == "false" && "$QUALITY_RESULT" != "skipped" ]]; then
            exit 1
          fi

          dependency_expected=false
          if [[ "$EVENT_NAME" == "pull_request" && "$IS_DRAFT" == "false" ]]; then
            dependency_expected=true
          fi
          if [[ "$dependency_expected" == "true" && "$DEPENDENCY_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$dependency_expected" == "false" && "$DEPENDENCY_RESULT" != "skipped" ]]; then
            exit 1
          fi

          platform_expected=false
          if [[ "$PLATFORM_PATH" == "true" && ( "$EVENT_NAME" != "pull_request" || "$IS_DRAFT" == "false" ) ]]; then
            platform_expected=true
          fi
          if [[ "$platform_expected" == "true" && "$PLATFORM_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$platform_expected" == "false" && "$PLATFORM_RESULT" != "skipped" ]]; then
            exit 1
          fi
