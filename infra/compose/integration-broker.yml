name: ${ASTER_INTEGRATION_PROJECT:?Run through pnpm integration:broker}

x-fixture-labels: &fixture-labels
  com.aster.environment: integration
  com.aster.scope: p01-r09
  com.aster.fixture: ${ASTER_INTEGRATION_PROJECT:?Run through pnpm integration:broker}

services:
  broker:
    image: docker.io/apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    labels: *fixture-labels
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:${ASTER_INTEGRATION_BROKER_PORT:?Run through pnpm integration:broker},INTERNAL://broker:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_NUM_NETWORK_THREADS: "2"
      KAFKA_NUM_IO_THREADS: "2"
      KAFKA_BACKGROUND_THREADS: "2"
      KAFKA_QUEUED_MAX_REQUESTS: "16"
      KAFKA_LOG_RETENTION_HOURS: "1"
      KAFKA_LOG_RETENTION_BYTES: "16777216"
      KAFKA_LOG_SEGMENT_BYTES: "8388608"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:ActiveProcessorCount=2
      LOG_DIR: /tmp/kafka-logs
    ports:
      - "127.0.0.1:${ASTER_INTEGRATION_BROKER_PORT:?Run through pnpm integration:broker}:9092"
    networks: [platform]
    volumes:
      - broker-data:/var/lib/kafka/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /opt/kafka/config:size=4m,uid=1000,gid=1000,mode=0750
      - /etc/kafka/secrets:size=1m,uid=1000,gid=1000,mode=0750
      - /mnt/shared/config:size=1m,uid=1000,gid=1000,mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 768m
    pids_limit: 192
    restart: "no"
    stop_grace_period: 5s
    healthcheck:
      test:
        - CMD
        - env
        - KAFKA_HEAP_OPTS=-Xms16m -Xmx64m
        - KAFKA_JVM_PERFORMANCE_OPTS=-XX:ActiveProcessorCount=1 -XX:TieredStopAtLevel=1
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - 127.0.0.1:19092
        - --list
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

networks:
  platform:
    labels: *fixture-labels

volumes:
  broker-data:
    labels:
      <<: *fixture-labels
      com.aster.authority: disposable-fixture
      com.aster.owner: integration
