global:
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 1m

scrape_configs:
  - job_name: aster-integration
    static_configs:
      - targets: [collector:8889]
    body_size_limit: 1MB
    sample_limit: 2000
    label_limit: 16
    label_name_length_limit: 128
    label_value_length_limit: 256
