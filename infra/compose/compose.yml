name: aster

x-postgres-image: &postgres-image docker.io/library/postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
x-redis-image: &redis-image docker.io/library/redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_DB: aster
      POSTGRES_PASSWORD: aster-test-only
      POSTGRES_USER: aster
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - platform
    healthcheck:
      test: [CMD-SHELL, pg_isready --host=127.0.0.1 --username=aster --dbname=aster]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 128

  redis:
    image: *redis-image
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lfu
    networks:
      - platform
    healthcheck:
      test: [CMD, redis-cli, --raw, ping]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 64

  platform-init:
    image: *postgres-image
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PGPASSWORD: aster-test-only
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        psql --host=postgres --username=aster --dbname=aster --set=ON_ERROR_STOP=1 --command='SELECT 1' >/dev/null
        printf '*1\r\n$$4\r\nPING\r\n' | nc -w 2 redis 6379 | tr -d '\r' | grep -qx '+PONG'
        printf 'aster local platform initialized\npostgres=healthy\nredis=healthy\n'
    networks:
      - platform
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 32

  platform-status:
    image: *postgres-image
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      platform-init:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: aster-test-only
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        printf 'aster local platform ready\nuse docker compose --project-name aster --file infra/compose/compose.yml ps --all for status\n'
        trap 'exit 0' TERM INT
        while :; do sleep 3600 & wait $$!; done
    networks:
      - platform
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host=postgres --username=aster --dbname=aster &&
          printf '*1\r\n$$4\r\nPING\r\n' | nc -w 2 redis 6379 | tr -d '\r' | grep -qx '+PONG'
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 32

networks:
  platform:
    internal: true
    labels:
      com.aster.environment: local
      com.aster.scope: platform

volumes:
  postgres-data:
    labels:
      com.aster.authority: durable-local
      com.aster.environment: local
      com.aster.owner: platform
