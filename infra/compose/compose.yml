name: aster

x-postgres-image: &postgres-image docker.io/library/postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
x-redis-image: &redis-image docker.io/library/redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241

x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  router:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/router.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    environment:
      ASTER_ENV: local
      ASTER_ROUTER_OTLP_ENABLED: "false"
      ASTER_ROUTER_TRUSTED_OPERATIONS_MODE: audit
      APOLLO_EXPOSE_QUERY_PLAN: "false"
    depends_on:
      router-trust-init:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
      playback:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - identity-router-trust:/run/aster-router/identity:ro
      - catalog-router-trust:/run/aster-router/catalog:ro
      - playback-router-trust:/run/aster-router/playback:ro
      - engagement-router-trust:/run/aster-router/engagement:ro
      - discovery-router-trust:/run/aster-router/discovery:ro
    networks: [platform, edge]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
          pids: 64

  router-trust-init:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/router-trust.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    volumes:
      - identity-router-trust:/run/aster-router/identity
      - catalog-router-trust:/run/aster-router/catalog
      - playback-router-trust:/run/aster-router/playback
      - engagement-router-trust:/run/aster-router/engagement
      - discovery-router-trust:/run/aster-router/discovery
      - playback-catalog-trust:/run/aster-playback-catalog
      - engagement-identity-trust:/run/aster-engagement-identity
      - engagement-playback-trust:/run/aster-engagement-playback
      - engagement-catalog-trust:/run/aster-engagement-catalog
      - discovery-catalog-trust:/run/aster-discovery-catalog
    network_mode: none
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 5s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 32

  catalog:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/catalog.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      catalog-init:
        condition: service_completed_successfully
      router-trust-init:
        condition: service_completed_successfully
    environment:
      ASTER_ENVIRONMENT: local
      ASTER_CATALOG_LOCAL_ENABLED: "true"
      ASTER_CATALOG_HTTP_HOST: 0.0.0.0
      ASTER_CATALOG_HTTP_PORT: "3200"
      ASTER_CATALOG_READER_DATABASE_URL: postgresql://aster_catalog_reader_local@postgres:5432/aster
      ASTER_CATALOG_READER_DATABASE_PASSWORD: aster-test-only
      ASTER_ROUTER_TRUST_ENABLED: "true"
      ASTER_CATALOG_PLAYBACK_READ_ENABLED: "true"
      ASTER_CATALOG_ENGAGEMENT_READ_ENABLED: "true"
      ASTER_CATALOG_CACHE_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - catalog-router-trust:/run/aster-router:ro
      - playback-catalog-trust:/run/aster-playback-catalog:ro
      - engagement-catalog-trust:/run/aster-engagement-catalog:ro
    networks: [platform]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
          pids: 64

  catalog-init:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/catalog.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASTER_ENVIRONMENT: local
      ASTER_CATALOG_OPERATOR_ENABLED: "true"
      ASTER_CATALOG_ADMIN_DATABASE_URL: postgresql://aster@postgres:5432/aster
      ASTER_CATALOG_ADMIN_DATABASE_PASSWORD: aster-test-only
    command: ["./dist/src/migrate-local.js"]
    networks: [platform]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    stop_grace_period: 5s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 32

  playback:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/playback.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      playback-init:
        condition: service_completed_successfully
      router-trust-init:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
    environment:
      ASTER_ENVIRONMENT: local
      ASTER_PLAYBACK_LOCAL_ENABLED: "true"
      ASTER_PLAYBACK_HTTP_HOST: 0.0.0.0
      ASTER_PLAYBACK_HTTP_PORT: "3300"
      ASTER_PLAYBACK_DATABASE_URL: postgresql://aster_playback_local@postgres:5432/aster
      ASTER_PLAYBACK_DATABASE_PASSWORD: aster-test-only
      ASTER_ROUTER_TRUST_ENABLED: "true"
      ASTER_PLAYBACK_ENGAGEMENT_READ_ENABLED: "true"
    volumes:
      - playback-router-trust:/run/aster-router:ro
      - playback-catalog-trust:/run/aster-playback-catalog:ro
      - engagement-playback-trust:/run/aster-engagement-playback:ro
    networks: [platform]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
          pids: 64

  playback-init:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/playback.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASTER_ENVIRONMENT: local
      ASTER_PLAYBACK_MIGRATION_ENABLED: "true"
      ASTER_PLAYBACK_ADMIN_DATABASE_URL: postgresql://aster@postgres:5432/aster
      ASTER_PLAYBACK_ADMIN_DATABASE_PASSWORD: aster-test-only
    command: ["./dist/src/migrate-local.js"]
    networks: [platform]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    stop_grace_period: 15s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 32

  engagement:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/engagement.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      engagement-init:
        condition: service_completed_successfully
      router-trust-init:
        condition: service_completed_successfully
    environment:
      ASTER_ENVIRONMENT: local
      ASTER_ENGAGEMENT_LOCAL_ENABLED: "true"
      ASTER_ENGAGEMENT_HTTP_HOST: 0.0.0.0
      ASTER_ENGAGEMENT_HTTP_PORT: "3400"
      ASTER_ENGAGEMENT_DATABASE_URL: postgresql://aster_engagement_local@postgres:5432/aster
      ASTER_ENGAGEMENT_DATABASE_PASSWORD: aster-test-only
      ASTER_ENGAGEMENT_RATE_LIMIT_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      ASTER_ROUTER_TRUST_ENABLED: "true"
    volumes:
      - engagement-router-trust:/run/aster-router:ro
      - engagement-identity-trust:/run/aster-engagement-identity:ro
      - engagement-playback-trust:/run/aster-engagement-playback:ro
      - engagement-catalog-trust:/run/aster-engagement-catalog:ro
    networks: [platform]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
          pids: 64

  engagement-init:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/engagement.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASTER_ENVIRONMENT: local
      ASTER_ENGAGEMENT_MIGRATION_ENABLED: "true"
      ASTER_ENGAGEMENT_ADMIN_DATABASE_URL: postgresql://aster@postgres:5432/aster
      ASTER_ENGAGEMENT_ADMIN_DATABASE_PASSWORD: aster-test-only
    command: ["./dist/src/migrate-local.js"]
    networks: [platform]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    stop_grace_period: 15s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 32

  identity:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/identity.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      identity-init:
        condition: service_completed_successfully
      router-trust-init:
        condition: service_completed_successfully
    environment:
      ASTER_ENV: local
      ASTER_HTTP_HOST: 0.0.0.0
      ASTER_HTTP_PORT: "3100"
      ASTER_SERVICE_NAME: identity
      ASTER_STARTUP_DEADLINE_MS: "15000"
      DATABASE_URL: postgresql://aster_identity_local@postgres:5432/aster
      ASTER_DATABASE_PASSWORD: aster-test-only
      REDIS_URL: redis://redis:6379/0
      ASTER_LOCAL_DEMO_ENABLED: "true"
      ASTER_PUBLIC_ORIGIN: http://127.0.0.1:4000
      ASTER_ROUTER_TRUST_ENABLED: "true"
      ASTER_IDENTITY_ENGAGEMENT_READ_ENABLED: "true"
    volumes:
      - identity-router-trust:/run/aster-router:ro
      - engagement-identity-trust:/run/aster-engagement-identity:ro
    networks:
      - platform
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
          pids: 64

  identity-init:
    logging: *local-logging
    profiles: [runtime, integration, observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/identity.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      platform-init:
        condition: service_completed_successfully
    environment:
      ASTER_ENV: local
      ASTER_HTTP_HOST: 127.0.0.1
      ASTER_HTTP_PORT: "3100"
      ASTER_SERVICE_NAME: identity-migrate
      ASTER_STARTUP_DEADLINE_MS: "15000"
      DATABASE_URL: postgresql://aster@postgres:5432/aster
      ASTER_DATABASE_PASSWORD: aster-test-only
      REDIS_URL: redis://redis:6379/0
      ASTER_LOCAL_DEMO_ENABLED: "true"
      ASTER_PUBLIC_ORIGIN: http://127.0.0.1:3100
    command: ["./dist/src/migrate-local.js"]
    networks: [platform]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    stop_grace_period: 5s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 32

  postgres:
    logging: *local-logging
    image: *postgres-image
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    environment:
      POSTGRES_DB: aster
      POSTGRES_PASSWORD: aster-test-only
      POSTGRES_USER: aster
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - platform
    healthcheck:
      test: [CMD-SHELL, pg_isready --host=127.0.0.1 --username=aster --dbname=aster]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 128

  redis:
    logging: *local-logging
    image: *redis-image
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lfu
    networks:
      - platform
    healthcheck:
      test: [CMD, redis-cli, --raw, ping]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 64

  platform-init:
    logging: *local-logging
    image: *postgres-image
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PGPASSWORD: aster-test-only
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        psql --host=postgres --username=aster --dbname=aster --set=ON_ERROR_STOP=1 --command='SELECT 1' >/dev/null
        printf '*1\r\n$$4\r\nPING\r\n' | nc -w 2 redis 6379 | tr -d '\r' | grep -qx '+PONG'
        printf 'aster local platform initialized\npostgres=healthy\nredis=healthy\n'
    networks:
      - platform
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/postgresql:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 32

  platform-status:
    logging: *local-logging
    image: *postgres-image
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      platform-init:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: aster-test-only
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        printf 'aster local platform ready\nuse docker compose --project-name aster --file infra/compose/compose.yml ps --all for status\n'
        trap 'exit 0' TERM INT
        while :; do sleep 3600 & wait $$!; done
    networks:
      - platform
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/postgresql:size=1m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host=postgres --username=aster --dbname=aster &&
          printf '*1\r\n$$4\r\nPING\r\n' | nc -w 2 redis 6379 | tr -d '\r' | grep -qx '+PONG'
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 32

  broker:
    profiles: [integration, full]
    image: docker.io/apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_NUM_NETWORK_THREADS: "2"
      KAFKA_NUM_IO_THREADS: "2"
      KAFKA_BACKGROUND_THREADS: "2"
      KAFKA_QUEUED_MAX_REQUESTS: "16"
      KAFKA_LOG_RETENTION_HOURS: "1"
      KAFKA_LOG_RETENTION_BYTES: "16777216"
      KAFKA_LOG_SEGMENT_BYTES: "8388608"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:ActiveProcessorCount=2
      LOG_DIR: /tmp/kafka-logs
    networks: [platform]
    volumes:
      - broker-data:/var/lib/kafka/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /opt/kafka/config:size=4m,uid=1000,gid=1000,mode=0750
      - /etc/kafka/secrets:size=1m,uid=1000,gid=1000,mode=0750
      - /mnt/shared/config:size=1m,uid=1000,gid=1000,mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 768m
    pids_limit: 192
    restart: "no"
    stop_grace_period: 5s
    healthcheck:
      test:
        - CMD
        - env
        - KAFKA_HEAP_OPTS=-Xms16m -Xmx64m
        - KAFKA_JVM_PERFORMANCE_OPTS=-XX:ActiveProcessorCount=1 -XX:TieredStopAtLevel=1
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - 127.0.0.1:19092
        - --list
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  storage:
    profiles: [integration, full]
    image: docker.io/versity/versitygw:v1.7.0@sha256:c4cbd9d9cb8dedbb055ac788dbd02635651b9b1cebac95b095b3217231aa87ad
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    entrypoint: ["/usr/local/bin/versitygw"]
    command:
      - --port
      - :9000
      - --health
      - /health
      - --quiet
      - --max-connections
      - "64"
      - --max-requests
      - "16"
      - posix
      # v1.7.0 checks PUT preconditions before writing; serialize to close that race.
      - --concurrency
      - "1"
      - /data
    environment:
      ROOT_ACCESS_KEY: aster-test-access
      ROOT_SECRET_KEY: aster-test-only
    networks: [platform]
    volumes:
      - storage-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 384m
    pids_limit: 96
    restart: "no"
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

networks:
  edge:
    labels:
      com.aster.environment: local
      com.aster.scope: platform
  platform:
    internal: true
    labels:
      com.aster.environment: local
      com.aster.scope: platform

volumes:
  identity-router-trust:
    labels:
      com.aster.authority: disposable-local
      com.aster.environment: local
      com.aster.owner: platform
  catalog-router-trust:
    labels:
      com.aster.authority: disposable-local
      com.aster.environment: local
      com.aster.owner: platform
  playback-router-trust:
    labels:
      com.aster.authority: disposable-local
      com.aster.environment: local
      com.aster.owner: platform
  playback-catalog-trust:
    labels:
      com.aster.authority: disposable-local
      com.aster.environment: local
      com.aster.owner: platform
  postgres-data:
    labels:
      com.aster.authority: durable-local
      com.aster.environment: local
      com.aster.owner: platform
  engagement-router-trust:
    labels:
      com.aster.authority: disposable-local
      com.aster.environment: local
      com.aster.owner: platform
  engagement-identity-trust:
    labels:
      com.aster.authority: disposable-local
      com.aster.environment: local
      com.aster.owner: platform
  engagement-playback-trust:
    labels:
      com.aster.authority: disposable-local
      com.aster.environment: local
      com.aster.owner: platform
  engagement-catalog-trust:
    labels:
      com.aster.authority: disposable-local
