services:
  router:
    environment:
      ASTER_ROUTER_OTLP_ENABLED: "true"
  identity:
    environment:
      ASTER_OTLP_METRICS_ENDPOINT: http://collector:4318/v1/metrics
  catalog:
    environment:
      ASTER_OTLP_METRICS_ENDPOINT: http://collector:4318/v1/metrics
  playback:
    environment:
      ASTER_OTLP_METRICS_ENDPOINT: http://collector:4318/v1/metrics
  engagement:
    environment:
      ASTER_OTLP_METRICS_ENDPOINT: http://collector:4318/v1/metrics

  platform-status:
    depends_on:
      collector:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host=postgres --username=aster --dbname=aster &&
          printf '*1\r\n$$4\r\nPING\r\n' | nc -w 2 redis 6379 | tr -d '\r' | grep -qx '+PONG' &&
          wget -T 1 -q -O /dev/null --header 'Content-Type: application/json' --post-data='{}' http://collector:4318/v1/metrics &&
          wget -T 1 -q -O /dev/null http://prometheus:9090/-/ready
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 5s

  collector:
    profiles: [observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/collector.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    environment:
      GOMEMLIMIT: 80MiB
      GOMAXPROCS: "2"
    networks: [platform]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    restart: "no"
    stop_grace_period: 5s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  prometheus:
    profiles: [observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/prometheus.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    command:
      - --config.file=/etc/aster/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=128MB
      - --storage.tsdb.wal-segment-size=10MB
      - --query.timeout=2s
      - --query.max-concurrency=2
      - --query.max-samples=10000
      - --web.max-connections=16
      - --log.level=warn
      - --log.format=json
    environment:
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: "2"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
    networks: [platform, edge]
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: "no"
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  grafana:
    profiles: [observability, full]
    build:
      context: ../..
      dockerfile: infra/docker/grafana.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: platform
    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_DEVICE_LIMIT: "8"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 15s
      GF_DATAPROXY_TIMEOUT: "3"
      GF_EXPLORE_ENABLED: "false"
      GF_LOG_LEVEL: warn
      GF_LOG_MODE: console
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_SERVER_DOMAIN: 127.0.0.1
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    networks: [edge]
    depends_on:
      prometheus:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/lib/grafana:size=64m,uid=472,gid=0,mode=0750
      - /tmp:size=8m,uid=472,gid=0,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    restart: "no"
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  prometheus-data:
    labels:
      com.aster.authority: disposable-local
      com.aster.environment: local
      com.aster.owner: platform
