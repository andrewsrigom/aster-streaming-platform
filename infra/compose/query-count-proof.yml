# Disposable statement-count instrumentation for exact Router operation proofs.
services:
  postgres:
    command: !override
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.track_utility=off
