services:
  web:
    extends:
      file: demo.yml
      service: web
    depends_on:
      media-origin:
        condition: service_healthy

  catalog:
    depends_on:
      playable-seed:
        condition: service_completed_successfully

  storage:
    profiles: [runtime]

  media-origin-init:
    extends:
      file: media.yml
      service: media-origin-init
    profiles: [runtime]

  media-origin:
    extends:
      file: media.yml
      service: media-origin
    profiles: [runtime]

  playable-generate:
    profiles: [runtime]
    build:
      context: ../..
      dockerfile: infra/docker/media-fixture.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: playable-fixture
    environment:
      ASTER_MEDIA_FIXTURE: local
      ASTER_PLAYABLE_FIXTURE_EXPORT: "true"
    network_mode: none
    volumes: ["playable-fixture:/output"]
    tmpfs: ["/work:size=32m,uid=1000,gid=1000,mode=0700"]
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 384m
    pids_limit: 64
    restart: "no"
    stop_grace_period: 5s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  playable-seed:
    profiles: [runtime]
    build:
      context: ../..
      dockerfile: infra/docker/catalog.Dockerfile
    labels:
      com.aster.environment: local
      com.aster.scope: playable-fixture
    depends_on:
      catalog-init:
        condition: service_completed_successfully
      playable-generate:
        condition: service_completed_successfully
      media-origin-init:
        condition: service_completed_successfully
    environment:
      ASTER_ENVIRONMENT: local
      ASTER_CATALOG_OPERATOR_ENABLED: "true"
      ASTER_CATALOG_PLAYABLE_SEED_ENABLED: "true"
      ASTER_CATALOG_DATABASE_URL: postgresql://aster_catalog_local@postgres:5432/aster
      ASTER_CATALOG_DATABASE_PASSWORD: aster-test-only
      ASTER_CATALOG_ADMIN_DATABASE_URL: postgresql://aster@postgres:5432/aster
      ASTER_CATALOG_ADMIN_DATABASE_PASSWORD: aster-test-only
      NODE_OPTIONS: --max-old-space-size=192
    command: ["./dist/src/initialize-playable-demo.js"]
    networks: [platform]
    volumes: ["playable-fixture:/fixture:ro"]
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 256m
    pids_limit: 64
    healthcheck: { disable: true }
    restart: "no"
    stop_grace_period: 5s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  playable-fixture:
    labels:
      com.aster.environment: local
      com.aster.owner: catalog
      com.aster.authority: generated-local
