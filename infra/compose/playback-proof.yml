# Disposable session-contract proof. No media is downloaded or served by this fixture.
services:
  postgres:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql:rw,size=256m
  router:
    ports: !override ["127.0.0.1::4000"]
    depends_on: !override
      router-trust-init:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
      playback:
        condition: service_healthy
