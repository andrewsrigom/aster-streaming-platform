query Viewer {
  me {
    accountId
    expiresAt
  }
}
query Profiles {
  profiles {
    profiles {
      id
      displayName
      locale
      maturity
      avatarRef
      version
    }
    activeProfileId
  }
}
query Profile($id: ID!) {
  profile(id: $id) {
    id
    displayName
    locale
    maturity
    avatarRef
    version
  }
  activeProfile(id: $id) {
    id
    displayName
  }
}
mutation DemoSignIn {
  demoSignIn {
    code
    correlationId
    viewer {
      accountId
      expiresAt
    }
  }
}
mutation SignOut {
  signOut {
    code
    correlationId
    viewer {
      accountId
    }
  }
}
mutation CreateProfile($input: CreateProfileInput!) {
  createProfile(input: $input) {
    code
    correlationId
    profileId
    version
  }
}
mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    code
    correlationId
    profileId
    version
  }
}
mutation DeleteProfile($input: DeleteProfileInput!) {
  deleteProfile(input: $input) {
    code
    correlationId
    profileId
    version
  }
}
mutation SelectProfile($id: ID!) {
  selectProfile(id: $id) {
    code
    correlationId
    profile {
      id
      displayName
    }
  }
}
query Browse($first: Int! = 20, $after: String, $locale: String! = "en") {
  titles(first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        localized(locale: $locale) {
          locale
          title
          synopsis
        }
        runtimeSeconds
        releaseYear
        languages
        genres
        accessibility
        editorialLabels
        credits {
          name
          role
        }
        artwork {
          url
          altText
          attribution {
            creator
            licenseUrl
          }
        }
        attribution {
          workTitle
          creator
          copyrightHolder
          sourceUrl
          licenseName
          licenseVersion
          licenseUrl
          attributionText
          modificationNotice
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
query TitleDetail($id: ID!, $locale: String! = "en") {
  title(id: $id) {
    id
    localized(locale: $locale) {
      locale
      title
      synopsis
    }
    runtimeSeconds
    releaseYear
    languages
    genres
    accessibility
    editorialLabels
    credits {
      name
      role
    }
    artwork {
      url
      altText
      attribution {
        creator
        licenseUrl
      }
    }
    attribution {
      workTitle
      creator
      copyrightHolder
      sourceUrl
      licenseName
      licenseVersion
      licenseUrl
      attributionText
      modificationNotice
    }
  }
}
query ViewerAndTitle($id: ID!) {
  me {
    accountId
  }
  title(id: $id) {
    id
    localized {
      title
    }
  }
}
mutation StartPlayback($titleId: ID!) {
  createPlaybackSession(titleId: $titleId) {
    code
    correlationId
    session {
      id
      titleId
      manifestUrl
      expiresAt
    }
  }
}

mutation RecordProgress($input: RecordProgressInput!) {
  recordProgress(input: $input) {
    code
    correlationId
    progress {
      id
      profileId
      titleId
      sequence
      version
      positionMs
      durationMs
      status
      occurredAt
      updatedAt
    }
  }
}

query ProgressHistory($profileId: ID!, $first: Int! = 20, $after: String) {
  progressHistory(profileId: $profileId, first: $first, after: $after) {
    code
    correlationId
    connection {
      edges {
        cursor
        node {
          id
          titleId
          sequence
          version
          positionMs
          durationMs
          status
          updatedAt
          title {
            id
            localized {
              title
            }
          }
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}

query ContinueWatching($profileId: ID!, $first: Int! = 20, $after: String) {
  continueWatching(profileId: $profileId, first: $first, after: $after) {
    code
    correlationId
    connection {
      edges {
        cursor
        node {
          id
          titleId
          sequence
          version
          positionMs
          durationMs
          status
          updatedAt
          title {
            id
            localized {
              title
            }
          }
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
