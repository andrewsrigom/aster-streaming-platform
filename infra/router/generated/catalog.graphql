extend schema @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@inaccessible", "@cost", "@listSize"])

enum CatalogAccessibility {
  CAPTIONS
  AUDIO_DESCRIPTION
  TRANSCRIPT
}

type CatalogAttribution {
  workTitle: String!
  creator: String!
  copyrightHolder: String!
  sourceUrl: String!
  licenseName: String!
  licenseVersion: String!
  licenseUrl: String!
  attributionText: String!
  modificationNotice: String!
}

type CatalogArtwork {
  url: String!
  altText: String!
  attribution: CatalogAttribution!
}

type CatalogCredit {
  name: String!
  role: String!
}

type LocalizedTitle {
  locale: String!
  title: String!
  synopsis: String!
}

type Title @key(fields: "id") @cost(weight: 6) {
  id: ID!
  localized(locale: String! = "en"): LocalizedTitle!
  releaseYear: Int
  runtimeSeconds: Int
  genres: [String!]! @cost(weight: 1) @listSize(assumedSize: 8)
  languages: [String!]! @cost(weight: 1) @listSize(assumedSize: 8)
  accessibility: [CatalogAccessibility!]! @cost(weight: 1) @listSize(assumedSize: 3)
  editorialLabels: [String!]! @cost(weight: 1) @listSize(assumedSize: 8)
  credits: [CatalogCredit!]! @listSize(assumedSize: 16)
  artwork: CatalogArtwork
  attribution: CatalogAttribution!
}

type CatalogTitleEdge {
  cursor: String!
  node: Title!
}

type CatalogPageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type CatalogTitleConnection {
  edges: [CatalogTitleEdge!]! @listSize(assumedSize: 20)
  pageInfo: CatalogPageInfo!
}

type CurrentPlaybackPublication @inaccessible {
  titleId: ID!
  publicationId: ID!
  titleVersion: Int!
  manifestUrl: String!
  checkedAt: Float!
  validUntil: Float
}

type Query {
  titles(first: Int!, after: String): CatalogTitleConnection! @cost(weight: 8)
  title(id: ID!): Title @cost(weight: 6)
  _playbackPublications(ids: [ID!]!): [CurrentPlaybackPublication]! @inaccessible
  _engagementTitles(ids: [ID!]!): EngagementTitleVisibility! @inaccessible
  _discoverySnapshots(ids: [ID!]!): [DiscoverySourceSnapshot]! @inaccessible
  _discoveryExport(after: ID): DiscoverySourcePage! @inaccessible
}

type DiscoverySourceDocument @inaccessible {
  defaultLocale: String!
  localizations: [LocalizedTitle!]!
  genres: [String!]!
  editorialLabels: [String!]!
  releaseYear: Int
  publishedAt: Float!
}

type DiscoverySourceSnapshot @inaccessible {
  titleId: ID!
  sourceVersion: Int!
  observedAt: Float!
  visibleUntil: Float
  document: DiscoverySourceDocument
}

type DiscoverySourcePage @inaccessible {
  snapshots: [DiscoverySourceSnapshot!]!
  endCursor: ID
  hasNextPage: Boolean!
}

type EngagementVisibleTitle @inaccessible {
  titleId: ID!
  visible: Boolean!
}

type EngagementTitleVisibility @inaccessible {
  code: String!
  checkedAt: Float!
  expiresAt: Float!
  titles: [EngagementVisibleTitle!]!
}
