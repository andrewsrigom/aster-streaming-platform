extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@inaccessible"])

enum PlaybackSessionCode {
  COMPLETED
  INVALID_INPUT
  NOT_PLAYABLE
  UNAVAILABLE
  CANCELLED
  INDETERMINATE
  LIMIT_EXCEEDED
}

type PlaybackSession {
  id: ID!
  titleId: ID!
  manifestUrl: String!
  expiresAt: Float!
}

type EngagementSessionAuthority @inaccessible {
  code: PlaybackSessionCode!
  sessionId: ID
  titleId: ID
  checkedAt: Float
  createdAt: Float
  expiresAt: Float
}

type Query {
  _engagementSession(sessionId: ID!, titleId: ID!): EngagementSessionAuthority! @inaccessible
}

type PlaybackSessionPayload {
  code: PlaybackSessionCode!
  correlationId: ID!
  session: PlaybackSession
}

type Mutation {
  createPlaybackSession(titleId: ID!): PlaybackSessionPayload!
}
