extend schema @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@cost", "@listSize"])

enum ProgressStatus {
  NOT_STARTED
  IN_PROGRESS
  COMPLETED
}

enum ProgressCode {
  COMPLETED
  INVALID_INPUT
  UNAUTHENTICATED
  NOT_FOUND
  NOT_PLAYABLE
  STALE
  CONFLICT
  BACKPRESSURE
  LIMIT_EXCEEDED
  UNAVAILABLE
  CANCELLED
  INDETERMINATE
}

input RecordProgressInput {
  profileId: ID!
  titleId: ID!
  playbackSessionId: ID!
  idempotencyKey: ID!
  sequence: Int!
  positionMs: Int!
  durationMs: Int!
  occurredAt: Float!
}

type Progress {
  id: ID!
  profileId: ID!
  titleId: ID!
  sequence: Int!
  version: Int!
  positionMs: Int!
  durationMs: Int!
  status: ProgressStatus!
  occurredAt: Float!
  updatedAt: Float!
  title: Title
}

type Title @key(fields: "id") {
  id: ID!
  progress(profileId: ID!): Progress @cost(weight: 8)
  inWatchlist(profileId: ID!): Boolean @cost(weight: 6)
}

type Profile @key(fields: "id") {
  id: ID!
  progress(titleId: ID!): Progress @cost(weight: 8)
  inWatchlist(titleId: ID!): Boolean @cost(weight: 6)
}

type ProgressEdge {
  cursor: String!
  node: Progress!
}

type ProgressPageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type ProgressConnection {
  edges: [ProgressEdge!]! @listSize(assumedSize: 20)
  pageInfo: ProgressPageInfo!
}

type ProgressPagePayload {
  code: ProgressCode!
  correlationId: ID!
  connection: ProgressConnection
}

type Query {
  progressHistory(profileId: ID!, first: Int! = 20, after: String): ProgressPagePayload! @cost(weight: 12)
  continueWatching(profileId: ID!, first: Int! = 20, after: String): ProgressPagePayload! @cost(weight: 12)
  homeContinueWatching(profileId: ID!, first: Int! = 10, after: String): ProgressPagePayload @cost(weight: 12)
  watchlist(profileId: ID!, first: Int! = 20, after: String): WatchlistPagePayload! @cost(weight: 12)
}

type ProgressPayload {
  code: ProgressCode!
  correlationId: ID!
  retryAfterMs: Int
  progress: Progress
}

enum WatchlistCode {
  COMPLETED
  INVALID_INPUT
  UNAUTHENTICATED
  NOT_FOUND
  NOT_VISIBLE
  CONFLICT
  BACKPRESSURE
  LIMIT_EXCEEDED
  UNAVAILABLE
  CANCELLED
  INDETERMINATE
}

input SetWatchlistInput {
  profileId: ID!
  titleId: ID!
  idempotencyKey: ID!
  present: Boolean!
}

type WatchlistChange {
  id: ID!
  profileId: ID!
  titleId: ID!
  present: Boolean!
  version: Int!
  updatedAt: Float!
}

type WatchlistEntry {
  id: ID!
  profileId: ID!
  titleId: ID!
  addedAt: Float!
  title: Title
}

type WatchlistEdge {
  cursor: String!
  node: WatchlistEntry!
}

type WatchlistConnection {
  edges: [WatchlistEdge!]! @listSize(assumedSize: 20)
  pageInfo: ProgressPageInfo!
}

type WatchlistPagePayload {
  code: WatchlistCode!
  correlationId: ID!
  connection: WatchlistConnection
}

type WatchlistPayload {
  code: WatchlistCode!
  correlationId: ID!
  retryAfterMs: Int
  change: WatchlistChange
}

type Mutation {
  recordProgress(input: RecordProgressInput!): ProgressPayload! @cost(weight: 20)
  setWatchlist(input: SetWatchlistInput!): WatchlistPayload! @cost(weight: 18)
}
