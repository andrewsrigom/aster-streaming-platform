extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@inaccessible"])

enum IdentityOutcome {
  COMPLETED
  UNAUTHENTICATED
  UNAVAILABLE
  CANCELLED
  INDETERMINATE
  LIMIT_EXCEEDED
  INVALID_INPUT
  NOT_FOUND
  CONFLICT
  BACKPRESSURE
}

enum ProfileMaturity {
  GENERAL
  TEEN
  MATURE
}

type Profile @key(fields: "id") {
  id: ID!
  displayName: String!
  locale: String!
  maturity: ProfileMaturity!
  avatarRef: String
  version: Int!
}

type Viewer {
  accountId: ID!
  expiresAt: String!
}

type EngagementProfileAuthority @inaccessible {
  code: IdentityOutcome!
  accountId: ID
  profileId: ID
  checkedAt: Float
  expiresAt: Float
}

type OwnedProfiles {
  profiles: [Profile!]!
  activeProfileId: ID
}

type SessionPayload {
  code: IdentityOutcome!
  correlationId: ID!
  viewer: Viewer
}

type ProfileMutationPayload {
  code: IdentityOutcome!
  correlationId: ID!
  profileId: ID
  version: Int
}

type ProfileSelectionPayload {
  code: IdentityOutcome!
  correlationId: ID!
  profile: Profile
}

input ProfilePreferencesInput {
  displayName: String!
  locale: String!
  maturity: ProfileMaturity!
}

input CreateProfileInput {
  mutationId: ID!
  profile: ProfilePreferencesInput!
}

input UpdateProfileInput {
  mutationId: ID!
  profileId: ID!
  expectedVersion: Int!
  profile: ProfilePreferencesInput!
}

input DeleteProfileInput {
  mutationId: ID!
  profileId: ID!
  expectedVersion: Int!
}

type Query {
  _engagementProfile(profileId: ID!): EngagementProfileAuthority! @inaccessible
  me: Viewer
  profiles: OwnedProfiles!
  profile(id: ID!): Profile
  activeProfile(id: ID!): Profile
}

type Mutation {
  demoSignIn: SessionPayload!
  signOut: SessionPayload!
  createProfile(input: CreateProfileInput!): ProfileMutationPayload!
  updateProfile(input: UpdateProfileInput!): ProfileMutationPayload!
  deleteProfile(input: DeleteProfileInput!): ProfileMutationPayload!
  selectProfile(id: ID!): ProfileSelectionPayload!
}
