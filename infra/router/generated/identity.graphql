extend schema @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@inaccessible", "@cost", "@listSize"])

enum IdentityOutcome {
  COMPLETED
  UNAUTHENTICATED
  UNAVAILABLE
  CANCELLED
  INDETERMINATE
  LIMIT_EXCEEDED
  INVALID_INPUT
  NOT_FOUND
  CONFLICT
  BACKPRESSURE
}

enum ProfileMaturity {
  GENERAL
  TEEN
  MATURE
}

type Profile @key(fields: "id") @cost(weight: 4) {
  id: ID! @cost(weight: 0)
  displayName: String! @cost(weight: 0)
  locale: String! @cost(weight: 0)
  maturity: ProfileMaturity! @cost(weight: 0)
  avatarRef: String @cost(weight: 0)
  version: Int! @cost(weight: 0)
}

type Viewer {
  accountId: ID!
  expiresAt: String!
}

type EngagementProfileAuthority @inaccessible {
  code: IdentityOutcome!
  accountId: ID
  profileId: ID
  checkedAt: Float
  expiresAt: Float
}

type OwnedProfiles {
  profiles: [Profile!]! @listSize(assumedSize: 16)
  activeProfileId: ID
}

type SessionPayload {
  code: IdentityOutcome!
  correlationId: ID!
  viewer: Viewer
}

type ProfileMutationPayload {
  code: IdentityOutcome!
  correlationId: ID!
  profileId: ID
  version: Int
}

type ProfileSelectionPayload {
  code: IdentityOutcome!
  correlationId: ID!
  profile: Profile
}

input ProfilePreferencesInput {
  displayName: String!
  locale: String!
  maturity: ProfileMaturity!
}

input CreateProfileInput {
  mutationId: ID!
  profile: ProfilePreferencesInput!
}

input UpdateProfileInput {
  mutationId: ID!
  profileId: ID!
  expectedVersion: Int!
  profile: ProfilePreferencesInput!
}

input DeleteProfileInput {
  mutationId: ID!
  profileId: ID!
  expectedVersion: Int!
}

type Query {
  _engagementProfile(profileId: ID!): EngagementProfileAuthority! @inaccessible
  me: Viewer @cost(weight: 4)
  profiles: OwnedProfiles! @cost(weight: 6)
  profile(id: ID!): Profile @cost(weight: 4)
  activeProfile(id: ID!): Profile @cost(weight: 4)
}

type Mutation {
  demoSignIn: SessionPayload! @cost(weight: 12)
  signOut: SessionPayload! @cost(weight: 12)
  createProfile(input: CreateProfileInput!): ProfileMutationPayload! @cost(weight: 18)
  updateProfile(input: UpdateProfileInput!): ProfileMutationPayload! @cost(weight: 18)
  deleteProfile(input: DeleteProfileInput!): ProfileMutationPayload! @cost(weight: 18)
  selectProfile(id: ID!): ProfileSelectionPayload! @cost(weight: 12)
}
