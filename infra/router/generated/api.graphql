enum CatalogAccessibility {
  AUDIO_DESCRIPTION
  CAPTIONS
  TRANSCRIPT
}

type CatalogArtwork {
  altText: String!
  attribution: CatalogAttribution!
  url: String!
}

type CatalogAttribution {
  attributionText: String!
  copyrightHolder: String!
  creator: String!
  licenseName: String!
  licenseUrl: String!
  licenseVersion: String!
  modificationNotice: String!
  sourceUrl: String!
  workTitle: String!
}

type CatalogCredit {
  name: String!
  role: String!
}

type CatalogPageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type CatalogTitleConnection {
  edges: [CatalogTitleEdge!]!
  pageInfo: CatalogPageInfo!
}

type CatalogTitleEdge {
  cursor: String!
  node: Title!
}

input CreateProfileInput {
  mutationId: ID!
  profile: ProfilePreferencesInput!
}

input DeleteProfileInput {
  expectedVersion: Int!
  mutationId: ID!
  profileId: ID!
}

type DiscoveryGenreRailResult {
  code: DiscoveryRailCode!
  rails: [DiscoveryRail!]!
}

enum DiscoveryHomeCode {
  CANCELLED
  COMPLETED
  INDETERMINATE
  INVALID_INPUT
  PARTIAL
  STALE
  UNAVAILABLE
}

type DiscoveryHomePayload {
  code: DiscoveryHomeCode!
  correlationId: ID!
  featured: DiscoveryRailResult
  generatedAt: Float
  generation: ID
  genres: DiscoveryGenreRailResult
  recentlyAdded: DiscoveryRailResult
  trending: DiscoveryRailResult
}

type DiscoveryPageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type DiscoveryRail {
  edges: [DiscoveryRailEdge!]!
  freshUntil: Float
  genre: String
  key: ID!
  kind: DiscoveryRailKind!
  oldestIndexedAt: Float
  source: DiscoveryRailSource!
}

enum DiscoveryRailCode {
  CANCELLED
  COMPLETED
  EMPTY
  FALLBACK
  INDETERMINATE
  UNAVAILABLE
}

type DiscoveryRailEdge {
  indexedAt: Float!
  node: Title
  sourceVersion: Int!
  visibleUntil: Float!
}

enum DiscoveryRailKind {
  FEATURED
  GENRE
  RECENTLY_ADDED
  TRENDING
}

type DiscoveryRailResult {
  code: DiscoveryRailCode!
  rail: DiscoveryRail
}

enum DiscoveryRailSource {
  FEATURED
  GENRE
  RECENTLY_ADDED
  TRENDING
}

enum DiscoverySearchCode {
  CANCELLED
  COMPLETED
  CURSOR_EXPIRED
  INDETERMINATE
  INVALID_INPUT
  STALE
  UNAVAILABLE
}

type DiscoverySearchConnection {
  edges: [DiscoverySearchEdge!]!
  generation: ID!
  pageInfo: DiscoveryPageInfo!
}

type DiscoverySearchEdge {
  cursor: String!
  indexedAt: Float!
  node: Title
  sourceVersion: Int!
  visibleUntil: Float!
}

type DiscoverySearchPayload {
  code: DiscoverySearchCode!
  connection: DiscoverySearchConnection
  correlationId: ID!
}

enum IdentityOutcome {
  BACKPRESSURE
  CANCELLED
  COMPLETED
  CONFLICT
  INDETERMINATE
  INVALID_INPUT
  LIMIT_EXCEEDED
  NOT_FOUND
  UNAUTHENTICATED
  UNAVAILABLE
}

type LocalizedTitle {
  locale: String!
  synopsis: String!
  title: String!
}

type Mutation {
  createPlaybackSession(titleId: ID!): PlaybackSessionPayload!
  createProfile(input: CreateProfileInput!): ProfileMutationPayload!
  deleteProfile(input: DeleteProfileInput!): ProfileMutationPayload!
  demoSignIn: SessionPayload!
  recordProgress(input: RecordProgressInput!): ProgressPayload!
  selectProfile(id: ID!): ProfileSelectionPayload!
  setWatchlist(input: SetWatchlistInput!): WatchlistPayload!
  signOut: SessionPayload!
  updateProfile(input: UpdateProfileInput!): ProfileMutationPayload!
}

type OwnedProfiles {
  activeProfileId: ID
  profiles: [Profile!]!
}

type PlaybackSession {
  expiresAt: Float!
  id: ID!
  manifestUrl: String!
  titleId: ID!
}

enum PlaybackSessionCode {
  CANCELLED
  COMPLETED
  INDETERMINATE
  INVALID_INPUT
  LIMIT_EXCEEDED
  NOT_PLAYABLE
  UNAVAILABLE
}

type PlaybackSessionPayload {
  code: PlaybackSessionCode!
  correlationId: ID!
  session: PlaybackSession
}

type Profile {
  avatarRef: String
  displayName: String!
  id: ID!
  inWatchlist(titleId: ID!): Boolean
  locale: String!
  maturity: ProfileMaturity!
  progress(titleId: ID!): Progress
  version: Int!
}

enum ProfileMaturity {
  GENERAL
  MATURE
  TEEN
}

type ProfileMutationPayload {
  code: IdentityOutcome!
  correlationId: ID!
  profileId: ID
  version: Int
}

input ProfilePreferencesInput {
  displayName: String!
  locale: String!
  maturity: ProfileMaturity!
}

type ProfileSelectionPayload {
  code: IdentityOutcome!
  correlationId: ID!
  profile: Profile
}

type Progress {
  durationMs: Int!
  id: ID!
  occurredAt: Float!
  positionMs: Int!
  profileId: ID!
  sequence: Int!
  status: ProgressStatus!
  title: Title
  titleId: ID!
  updatedAt: Float!
  version: Int!
}

enum ProgressCode {
  BACKPRESSURE
  CANCELLED
  COMPLETED
  CONFLICT
  INDETERMINATE
  INVALID_INPUT
  LIMIT_EXCEEDED
  NOT_FOUND
  NOT_PLAYABLE
  STALE
  UNAUTHENTICATED
  UNAVAILABLE
}

type ProgressConnection {
  edges: [ProgressEdge!]!
  pageInfo: ProgressPageInfo!
}

type ProgressEdge {
  cursor: String!
  node: Progress!
}

type ProgressPageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type ProgressPagePayload {
  code: ProgressCode!
  connection: ProgressConnection
  correlationId: ID!
}

type ProgressPayload {
  code: ProgressCode!
  correlationId: ID!
  progress: Progress
}

enum ProgressStatus {
  COMPLETED
  IN_PROGRESS
  NOT_STARTED
}

type Query {
  activeProfile(id: ID!): Profile
  continueWatching(after: String, first: Int! = 20, profileId: ID!): ProgressPagePayload!
  homeContinueWatching(after: String, first: Int! = 10, profileId: ID!): ProgressPagePayload
  homeRails(first: Int! = 10): DiscoveryHomePayload!
  me: Viewer
  profile(id: ID!): Profile
  profiles: OwnedProfiles!
  progressHistory(after: String, first: Int! = 20, profileId: ID!): ProgressPagePayload!
  searchTitles(after: String, first: Int! = 20, locale: String!, query: String!): DiscoverySearchPayload!
  title(id: ID!): Title
  titles(after: String, first: Int!): CatalogTitleConnection!
  watchlist(after: String, first: Int! = 20, profileId: ID!): WatchlistPagePayload!
}

input RecordProgressInput {
  durationMs: Int!
  idempotencyKey: ID!
  occurredAt: Float!
  playbackSessionId: ID!
  positionMs: Int!
  profileId: ID!
  sequence: Int!
  titleId: ID!
}

type SessionPayload {
  code: IdentityOutcome!
  correlationId: ID!
  viewer: Viewer
}

input SetWatchlistInput {
  idempotencyKey: ID!
  present: Boolean!
  profileId: ID!
  titleId: ID!
}

type Title {
  accessibility: [CatalogAccessibility!]!
  artwork: CatalogArtwork
  attribution: CatalogAttribution!
  credits: [CatalogCredit!]!
  editorialLabels: [String!]!
  genres: [String!]!
  id: ID!
  inWatchlist(profileId: ID!): Boolean
  languages: [String!]!
  localized(locale: String! = "en"): LocalizedTitle!
  progress(profileId: ID!): Progress
  releaseYear: Int
  runtimeSeconds: Int
}

input UpdateProfileInput {
  expectedVersion: Int!
  mutationId: ID!
  profile: ProfilePreferencesInput!
  profileId: ID!
}

type Viewer {
  accountId: ID!
  expiresAt: String!
}

type WatchlistChange {
  id: ID!
  present: Boolean!
  profileId: ID!
  titleId: ID!
  updatedAt: Float!
  version: Int!
}

enum WatchlistCode {
  BACKPRESSURE
  CANCELLED
  COMPLETED
  CONFLICT
  INDETERMINATE
  INVALID_INPUT
  LIMIT_EXCEEDED
  NOT_FOUND
  NOT_VISIBLE
  UNAUTHENTICATED
  UNAVAILABLE
}

type WatchlistConnection {
  edges: [WatchlistEdge!]!
  pageInfo: ProgressPageInfo!
}

type WatchlistEdge {
  cursor: String!
  node: WatchlistEntry!
}

type WatchlistEntry {
  addedAt: Float!
  id: ID!
  profileId: ID!
  title: Title
  titleId: ID!
}

type WatchlistPagePayload {
  code: WatchlistCode!
  connection: WatchlistConnection
  correlationId: ID!
}

type WatchlistPayload {
  change: WatchlistChange
  code: WatchlistCode!
  correlationId: ID!
}
